spring:
  application:
    name: webshop-db-service
  datasource:
    url: ${DB_URL:jdbc:mariadb://localhost:3306/webshop}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      # The schema is owned by the SQL scripts in resources/sql; Hibernate only checks the entities against it.
      ddl-auto: validate
      naming:
        # Keep table names exactly as written in @Table (Spring's default would turn ProductCategories into product_categories).
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
